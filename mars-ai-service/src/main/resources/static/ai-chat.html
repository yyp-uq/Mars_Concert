<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>火星小助手 · 智能客服</title>
  <style>
    :root {
      --mars-blue: #1e5eff;
      --mars-blue-dark: #1442b8;
      --mars-bg: #f4f8ff;
      --mars-border: #dbe6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: linear-gradient(160deg, #eaf2ff 0%, #ffffff 55%, #eef5ff 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      color: #1b2a4a;
    }
    .chat-shell {
      width: min(860px, 100%);
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      box-shadow: 0 0 40px rgba(30, 94, 255, .12);
    }
    header {
      padding: 18px 24px;
      background: var(--mars-blue);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: #fff; color: var(--mars-blue);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 18px;
    }
    header h1 { font-size: 18px; margin: 0; font-weight: 600; }
    header p { margin: 2px 0 0; font-size: 12px; opacity: .85; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: var(--mars-bg);
    }
    .msg {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.6;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--mars-blue);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #fff;
      border: 1px solid var(--mars-border);
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(30, 94, 255, .06);
    }
    .msg.assistant.error { border-color: #ffb4b4; color: #b42318; background: #fff5f5; }
    .msg.tip { align-self: center; background: transparent; color: #7b8aa8; font-size: 12px; }
    .composer {
      display: flex;
      gap: 10px;
      padding: 16px 20px;
      border-top: 1px solid var(--mars-border);
      background: #fff;
    }
    .composer input {
      flex: 1;
      border: 1px solid var(--mars-border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
      transition: border-color .2s;
    }
    .composer input:focus { border-color: var(--mars-blue); }
    .composer button {
      border: 0;
      border-radius: 10px;
      padding: 0 24px;
      background: var(--mars-blue);
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      transition: background .2s;
    }
    .composer button:hover { background: var(--mars-blue-dark); }
    .composer button:disabled { background: #a9c1ff; cursor: not-allowed; }
  </style>
</head>
<body>
<div class="chat-shell">
  <header>
    <div class="avatar">火</div>
    <div>
      <h1>火星小助手</h1>
      <p>购票 / 选座 / 退票 / 入场，随时问我 · 人工客服 9:00-21:00</p>
    </div>
  </header>

  <div id="messages">
    <div class="msg assistant">你好，我是火星小助手。可以帮你查订单、查余票、咨询退票政策，也可以帮你发起退款申请。</div>
  </div>

  <div class="composer">
    <input id="input" placeholder="例如：怎么退票？/ 我的订单出票了吗？/ 查一下余票" autocomplete="off"/>
    <button id="sendBtn" onclick="sendMessage()">发送</button>
  </div>
</div>

<script>
  // 会话 ID：同一页面内保持一致，多轮记忆靠它
  const convId = (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : 'conv-' + Date.now() + '-' + Math.random().toString(16).slice(2);

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  let busy = false;

  function append(role, text, extraClass) {
    const div = document.createElement('div');
    div.className = 'msg ' + role + (extraClass ? ' ' + extraClass : '');
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function accessToken() {
    return localStorage.getItem('mars_access') || '';
  }

  async function sendMessage(text, confirmToken) {
    if (busy) return;
    const content = (text !== undefined ? text : inputEl.value).trim();
    if (!content) return;

    if (text === undefined) append('user', content);
    inputEl.value = '';
    busy = true;
    sendBtn.disabled = true;

    const bubble = append('assistant', '');
    let pendingConfirm = null;

    try {
      const resp = await fetch('/api/v1/ai/chat/stream', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + accessToken()
        },
        body: JSON.stringify({conversationId: convId, message: content, confirmToken: confirmToken || null})
      });

      if (resp.status === 401) {
        bubble.classList.add('error');
        bubble.textContent = '登录已失效，请先登录后再使用智能客服。';
        return;
      }
      if (!resp.ok || !resp.body) {
        bubble.classList.add('error');
        bubble.textContent = '服务暂时不可用，请稍后重试或联系人工客服（9:00-21:00）。';
        return;
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buffer = '';

      while (true) {
        const {value, done} = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, {stream: true});
        const blocks = buffer.split('\n\n');
        buffer = blocks.pop();

        for (const block of blocks) {
          const lines = block.split('\n');
          let event = 'message';
          const dataLines = [];
          for (const line of lines) {
            if (line.startsWith('event:')) {
              event = line.slice(6).trim();
            } else if (line.startsWith('data:')) {
              dataLines.push(line.slice(5).replace(/^ /, ''));
            }
          }
          const data = dataLines.join('\n');
          if (event === 'delta') {
            bubble.textContent += data;
          } else if (event === 'error') {
            bubble.classList.add('error');
            bubble.textContent += (bubble.textContent ? '\n' : '') + data;
          } else if (event === 'need_confirm') {
            try {
              pendingConfirm = JSON.parse(data);
            } catch (e) {
              pendingConfirm = null;
            }
          }
        }
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
    } catch (e) {
      bubble.classList.add('error');
      bubble.textContent += (bubble.textContent ? '\n' : '') + '网络异常，请稍后重试。';
    } finally {
      busy = false;
      sendBtn.disabled = false;
    }

    // 退款二次确认：用户在弹窗点「确定」后才带 token 再发一轮
    if (pendingConfirm && pendingConfirm.token) {
      const ok = window.confirm(
          (pendingConfirm.message || '退款需要您明确确认') +
          '\n订单号：' + (pendingConfirm.orderNo || '-') +
          '\n确认后将立即提交退款申请，是否继续？');
      if (ok) {
        append('user', '确认退款');
        await sendMessage('确认退款，订单号 ' + (pendingConfirm.orderNo || ''), pendingConfirm.token);
      }
    }
  }

  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>
</body>
</html>
